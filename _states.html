<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;padding:12px;background:#666;display:flex;gap:12px}figure{margin:0}figcaption{color:#fff;font:12px monospace;padding:6px 0}iframe{border:0;display:block;background:#fff}</style></head>
<body>
<figure><figcaption>scrolled 2600</figcaption><iframe id="f2" src="index.html" width="390" height="844"></iframe></figure>
<figure><figcaption>faq open, scrolled to faq</figcaption><iframe id="f3" src="index.html" width="390" height="844"></iframe></figure>
<script>
window.addEventListener('load', () => setTimeout(() => {
  try {
    const w2 = document.getElementById('f2').contentWindow;
    w2.scrollTo({ top: 2600, behavior: 'instant' });
  } catch (e) {}
  try {
    const d3 = document.getElementById('f3').contentDocument;
    d3.querySelector('#faq details').setAttribute('open', '');
    const w3 = document.getElementById('f3').contentWindow;
    const y = d3.getElementById('faq').getBoundingClientRect().top + w3.scrollY - 100;
    w3.scrollTo({ top: y, behavior: 'instant' });
  } catch (e) {}
}, 300));
</script></body></html>

<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;padding:0;background:#666}iframe{border:0;display:block}</style></head>
<body><iframe id="f" src="index.html" width="320" height="3000"></iframe>
<script>window.addEventListener('load',()=>setTimeout(()=>{const d=document.getElementById('f').contentDocument.scrollingElement;const div=document.createElement('div');div.style.cssText='position:fixed;top:0;left:0;background:#fff;font:14px monospace;z-index:9';div.textContent='SW='+d.scrollWidth+' CW='+d.clientWidth;document.body.appendChild(div);},700));</script></body></html>

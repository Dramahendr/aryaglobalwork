<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;padding:0;background:#666}iframe{border:0;display:block}</style></head>
<body><iframe id="f" src="index.html" width="390" height="15000"></iframe>
<script>
window.addEventListener('load', () => setTimeout(() => {
  const d = document.getElementById('f').contentDocument.scrollingElement;
  let worst = [];
  document.getElementById('f').contentDocument.querySelectorAll('body *').forEach(el => {
    const r = el.getBoundingClientRect();
    if (r.right > d.clientWidth + 1 || r.left < -1) {
      worst.push(el.tagName + '.' + (typeof el.className === 'string' ? el.className.split(' ')[0] : '') + ' L' + Math.round(r.left) + ' R' + Math.round(r.right));
    }
  });
  const div = document.createElement('div');
  div.id = 'dbg';
  div.style.cssText = 'position:fixed;top:0;left:0;background:#fff;color:#000;font:12px monospace;z-index:9999;max-width:390px';
  div.textContent = 'DBG SW=' + d.scrollWidth + ' CW=' + d.clientWidth + ' :: ' + worst.slice(0, 10).join(' ## ');
  document.body.appendChild(div);
}, 800));
</script></body></html>
